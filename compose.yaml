services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=https://hvcgpdxqkznnhgtcfoqi.supabase.co
      - SUPABASE_KEY=PASTE_YOUR_ACTUAL_PUBLISHABLE_KEY_HERE
      - DATABASE_URL=postgres://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: